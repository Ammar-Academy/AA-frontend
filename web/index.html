        z-index: 9999;

      }

      /* Decorative background shapes */
      #splash-screen::before {
        content: "";
        position: absolute;
        top: -20%;
        right: -10%;
        width: 600px;
        height: 600px;
        background: radial-gradient(
          circle,

        overflow: hidden;

      .splash-logo::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          45deg,
          transparent,
          rgba(247, 147, 30, 0.08),

        );
        animation: shimmer 3s infinite;

      .splash-logo svg {
        width: 100px;
        height: 100px;
        z-index: 1;
      }

      .splash-title {
        font-family:

        animation: fadeInUp 1s ease-out 0.3s both;

        position: relative;
      }

      .splash-title span {
        color: #f7931e;
      }

      .splash-subtitle {
        font-family:

        margin-bottom: 50px;
        text-align: center;
        animation: fadeInUp 1s ease-out 0.5s both;
        z-index: 1;
        position: relative;
      }

      .splash-loader {
        width: 60px;
        height: 60px;
        position: relative;
        animation: fadeIn 1s ease-out 0.7s both;
      }

      .splash-loader::before,
      .splash-loader::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #f7931e;
      }

      .splash-loader::before {
        width: 60px;
        height: 60px;
        animation: spin 1.5s linear infinite;
      }

      .splash-loader::after {
        width: 45px;
        height: 45px;
        top: 7.5px;
        left: 7.5px;
        border-top-color: white;
        animation: spin 1s linear infinite reverse;
      }

      .splash-loading-text {
        font-family:

        animation: fadeIn 1s ease-out 0.9s both;
        z-index: 1;

      /* Animations */
      @keyframes fadeInScale {
        from {
          opacity: 0;
          transform: scale(0.8);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes shimmer {
        0% {
          transform: translateX(-100%) translateY(-100%) rotate(45deg);
        }
        100% {
          transform: translateX(100%) translateY(100%) rotate(45deg);
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      /* Responsive */

          font-size: 24px;
        }

          font-size: 16px;
        }
      }

<!-- AA-HOME:START — the homepage shown at ammar-academy.com/ (any other path boots the Flutter app) -->
<template id="aa-home-tpl">
<style>
#aa-home{--navy:#0E0F3B;--ink:#2B2C4F;--muted:#55567A;--line:#E4E5EE;--cream:#F4F2EC;--orange:#F7931E;--orange-dk:#B35F00;--orange-tint:#FFF1DF;--red:#CC2229;--red-dk:#A3161D;--red-tint:#FDECEC;--green:#0E7A3C;
  font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--navy);background:#fff;line-height:1.6;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased}
#aa-home *{box-sizing:border-box}
#aa-home a{color:inherit;text-decoration:none}
#aa-home img,#aa-home video{max-width:100%;display:block}
#aa-home img{height:auto}
#aa-home .wrap{max-width:1240px;margin:0 auto;padding:0 20px}
#aa-home .en{font-family:Montserrat,Cairo,sans-serif}
#aa-home .ltr{direction:ltr;unicode-bidi:isolate}
#aa-home h1,#aa-home h2,#aa-home h3,#aa-home p{margin:0}
#aa-home .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:17px;padding:14px 24px;border-radius:14px;min-height:48px;transition:transform .2s ease,filter .2s ease}
#aa-home .btn:hover{transform:translateY(-2px);filter:brightness(1.04)}
#aa-home .b-orange{background:var(--orange);color:var(--navy)}
#aa-home .b-red{background:var(--red);color:#fff}
#aa-home .b-navy{background:var(--navy);color:#fff}
#aa-home .b-green{background:var(--green);color:#fff}
#aa-home .b-line{background:#fff;border:2px solid var(--line);color:var(--navy)}
/* header */
#aa-home .top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:saturate(1.4) blur(6px)}
#aa-home .top .wrap{display:flex;align-items:center;gap:22px;padding-top:10px;padding-bottom:10px}
#aa-home .top .logo img{height:46px;width:auto}
#aa-home .nav{display:flex;gap:20px;font-weight:700;font-size:15.5px;flex:1;align-items:center;flex-wrap:wrap}
#aa-home .nav a:hover{color:var(--orange-dk)}
#aa-home .vocab-tab{display:inline-flex;align-items:center;gap:6px;background:var(--orange-tint);color:var(--orange-dk)!important;padding:5px 12px;border-radius:10px}
#aa-home .vocab-tab small{background:var(--orange);color:var(--navy);font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px}
#aa-home .top .btn{font-size:15px;padding:10px 18px;min-height:44px}
#aa-home .menu-btn{display:none;background:none;border:2px solid var(--line);border-radius:12px;width:46px;height:46px;align-items:center;justify-content:center;cursor:pointer;color:var(--navy)}
@media (max-width:980px){
  #aa-home .nav{display:none;position:absolute;top:100%;right:0;left:0;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:0;padding:8px 20px 16px}
  #aa-home .nav a{padding:12px 0;border-bottom:1px solid var(--line)}
  #aa-home .nav .vocab-tab{justify-content:center;margin-top:10px;border:0;padding:12px}
  #aa-home .top.open .nav{display:flex}
  #aa-home .menu-btn{display:inline-flex}
  #aa-home .top .wrap{gap:10px}
  #aa-home .top .logo{flex:1}
  #aa-home .top .free{display:none}
}
/* hero */
#aa-home .hero{background:var(--cream)}
#aa-home .hero .wrap{display:flex;gap:44px;align-items:center;padding-top:56px;padding-bottom:56px;flex-wrap:wrap}
#aa-home .hero-txt{flex:1 1 520px;display:flex;flex-direction:column;gap:18px}
#aa-home .pill{align-self:flex-start;background:var(--orange-tint);color:var(--orange-dk);font-weight:800;font-size:14.5px;padding:7px 16px;border-radius:999px}
#aa-home h1{font-size:clamp(30px,4.4vw,50px);line-height:1.3;font-weight:900}
#aa-home .hl-o{background:linear-gradient(transparent 58%,#FBD3A0 58%)}
#aa-home .hl-r{background:linear-gradient(transparent 58%,#F6C4C6 58%)}
#aa-home .lead{font-size:19px;line-height:1.8;color:var(--muted)}
#aa-home .row{display:flex;gap:12px;flex-wrap:wrap}
#aa-home .chip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 16px;min-width:110px}
#aa-home .chip b{font-family:Montserrat,sans-serif;font-size:25px;display:block;line-height:1.2}
#aa-home .chip span{font-size:13px;color:var(--muted)}
#aa-home .hero-vid{flex:0 1 330px;margin:0 auto}
/* videos */
#aa-home .vid{position:relative;border-radius:22px;overflow:hidden;background:#000;aspect-ratio:9/16;box-shadow:0 18px 44px rgba(14,15,59,.16)}
#aa-home .vid video{width:100%;height:100%;object-fit:cover}
#aa-home .vid .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;cursor:pointer;width:100%}
#aa-home .vid .play span{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.93);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .2s}
#aa-home .vid .play:hover span{transform:scale(1.08)}
#aa-home .vid.on .play{display:none}
#aa-home .cap{margin-top:10px;font-weight:800;text-align:center}
/* numbers strip */
#aa-home .nums{padding:52px 0;border-bottom:1px solid var(--line);direction:ltr;text-align:left}
#aa-home .nums .wrap{display:flex;gap:40px;align-items:center;flex-wrap:wrap}
#aa-home .nums h2{flex:1 1 420px;font-family:Montserrat,sans-serif;font-size:clamp(24px,2.6vw,33px);line-height:1.3;font-weight:900}
#aa-home .nums h2 em{color:var(--orange);font-style:normal}
#aa-home .nums ul{flex:1 1 540px;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px}
#aa-home .nums li{display:flex;align-items:center;gap:12px;font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(17px,1.7vw,21px);transition:transform .2s}
#aa-home .nums li:hover{transform:translateY(-4px)}
#aa-home .nums svg{flex:none}
/* sections */
#aa-home .sec{padding:68px 0}
#aa-home .head{text-align:center;margin-bottom:30px}
#aa-home .head h2{font-size:clamp(26px,3vw,37px);font-weight:900;margin-bottom:8px}
#aa-home .head p{font-size:17.5px;color:var(--muted)}
#aa-home .navy{background:var(--navy);color:#fff}
#aa-home .navy .head p{color:rgba(255,255,255,.75)}
/* packages */
#aa-home .pkgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:24px}
#aa-home .pkg{border:2px solid var(--orange);background:#FFFBF5;border-radius:24px;padding:30px;display:flex;flex-direction:column;gap:16px;transition:transform .25s ease,box-shadow .25s ease}
#aa-home .pkg:hover{transform:translateY(-8px);box-shadow:0 22px 48px rgba(14,15,59,.16)}
#aa-home .pkg .go{margin-top:auto;transition:transform .25s ease}
#aa-home .pkg:hover .go{transform:scale(1.03)}
#aa-home .pkg.ielts{border-color:var(--red);background:#FFF8F8}
#aa-home .pkg-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#aa-home .pkg-name{font-family:Montserrat,sans-serif;font-weight:900;font-size:38px;direction:ltr}
#aa-home .pkg-name i{font-style:normal;color:var(--orange-dk)}
#aa-home .tag{font-weight:800;font-size:13.5px;padding:6px 14px;border-radius:999px;background:var(--orange-tint);color:var(--orange-dk)}
#aa-home .ielts .tag{background:var(--red-tint);color:var(--red-dk)}
#aa-home .pkg p{font-size:17px;color:var(--muted)}
#aa-home .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
#aa-home .stats div{background:var(--orange-tint);border-radius:14px;padding:11px 12px}

#aa-home .stats b{font-family:Montserrat,sans-serif;font-size:23px;color:var(--orange-dk);display:block;direction:ltr;text-align:right}
#aa-home .ielts .stats b{color:var(--red-dk)}
#aa-home .stats span{font-size:13.5px;font-weight:700}
#aa-home .pkg ul{margin:0;padding:0 20px 0 0;font-size:16.5px;line-height:2;font-weight:600}

#aa-home .shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;align-items:start}
#aa-home .shots figure{margin:0;background:#fff;border-radius:18px;padding:10px}
#aa-home .shots img{width:100%;border-radius:10px}

    <script>
      // Track loading state
      let flutterReady = false;
      let domReady = false;
      let assetsReady = false;
      let splashRemoved = false;
      let readyCheckInterval = null;

      function updateLoadingText(text) {
        const loadingText = document.getElementById("loading-text");
        if (loadingText) {
          loadingText.textContent = text;
        }
      }

      function removeSplashScreen() {
        if (splashRemoved) return;

        const splashScreen = document.getElementById("splash-screen");
        if (splashScreen) {
          splashRemoved = true;
          updateLoadingText("Ready!");

          // Clear any intervals
          if (readyCheckInterval) {
            clearInterval(readyCheckInterval);
          }

          splashScreen.classList.add("fade-out");
          setTimeout(() => {
            splashScreen.remove();
          }, 500);
        }
      }

      function checkIfFullyLoaded() {
        // Check if Flutter app is fully rendered and interactive
        const flutterView = document.querySelector("flutter-view");
        const fltGlassPane = document.querySelector("flt-glass-pane");

        // Check if there are any pending images
        const images = document.querySelectorAll("img");
        let allImagesLoaded = true;
        images.forEach((img) => {
          if (!img.complete || img.naturalHeight === 0) {
            allImagesLoaded = false;
          }
        });

        // Check if fonts are loaded
        const fontsLoaded = document.fonts
          ? document.fonts.status === "loaded"
          : true;

        // Mark as ready if Flutter view exists and is rendered
        if (flutterView || fltGlassPane) {
          assetsReady = allImagesLoaded && fontsLoaded;
        }

        return flutterReady && domReady && assetsReady;
      }

      function checkAndRemoveSplash() {
        if (checkIfFullyLoaded()) {
          // Add extra delay to ensure everything is painted and settled
          setTimeout(removeSplashScreen, 800);
        } else {
          // Update loading text based on what's ready
          if (!domReady) {
            updateLoadingText("Loading resources...");
          } else if (!flutterReady) {
            updateLoadingText("Initializing app...");
          } else if (!assetsReady) {
            updateLoadingText("Loading assets...");
          }
        }
      }

      // Listen for Flutter first frame
      window.addEventListener("flutter-first-frame", function () {
        flutterReady = true;
        checkAndRemoveSplash();
      });

      // Wait for DOM to be fully loaded
      if (document.readyState === "complete") {
        domReady = true;
        checkAndRemoveSplash();
      } else {
        window.addEventListener("load", function () {
          domReady = true;
          checkAndRemoveSplash();
        });
      }

      // Wait for fonts to load
      if (document.fonts) {
        document.fonts.ready.then(function () {
          checkAndRemoveSplash();
        });
      }

      // Periodically check if everything is ready
      readyCheckInterval = setInterval(function () {
        if (splashRemoved) {
          clearInterval(readyCheckInterval);
          return;
        }
        checkAndRemoveSplash();
      }, 200);

      // Update loading text with animated dots
      let loadingDots = 0;
      const loadingInterval = setInterval(function () {
        if (splashRemoved) {
          clearInterval(loadingInterval);
          return;

        loadingDots = (loadingDots + 1) % 4;
        const dots = ".".repeat(loadingDots);

          baseText = "Initializing app";
        } else if (flutterReady && !assetsReady) {
          baseText = "Loading assets";
        }

        updateLoadingText(baseText + dots);

        clearInterval(loadingInterval);
        clearInterval(readyCheckInterval);

    <script>
      // Version checking system
      const VERSION_CHECK_INTERVAL = 5 * 60 * 1000; // Check every 5 minutes
      const VERSION_STORAGE_KEY = "app_version";
      const LAST_CHECK_KEY = "last_version_check";

      let currentVersion = null;
      let versionCheckInterval = null;

      // A refresh is cut off by the app after 20 seconds, so a flag that is
      // still up after this long was left behind.
      const MAX_REFRESH_WAIT = 25 * 1000;
      const RELOAD_FLAG_LIFETIME = 20 * 1000;

      // Version waiting to be loaded, and whether something already waits
      // to load it.
      let pendingVersion = null;
      let updateRunning = false;

      // Attempts of Real Tests. The timer runs on while the page reloads, so an
      // update waits until the student leaves. (/ielts-practice/ is a page of
      // its own, without this script.)
      function inTimedTest() {
        return /^\/real-tests\/[^/]+\/attempt\//.test(
          window.location.pathname,
        );
      }

      // Waits until a reload costs the user nothing: no timed test is open and
      // no token refresh is in flight. The backend rotates the refresh token
      // while the request is in flight; leaving before the response arrives
      // loses the new cookie and signs the user out. The app sets the flag
      // (lib/core/api/page_reload).
      async function waitForSafeMoment() {
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        let refreshDeadline = null;
        for (;;) {
          if (inTimedTest()) {
            refreshDeadline = null;
            await sleep(2000);
            continue;
          }
          if (!window.aaTokenRefreshInFlight) return;
          refreshDeadline ??= Date.now() + MAX_REFRESH_WAIT;
          if (Date.now() >= refreshDeadline) return;
          await sleep(250);
        }
      }

      async function fetchCurrentVersion() {
        try {
          // Add timestamp to prevent caching
          const response = await fetch("/version.json?t=" + Date.now(), {
            cache: "no-cache",
            headers: {
              "Cache-Control": "no-cache",
              Pragma: "no-cache",
            },
          });

          if (!response.ok) {
            console.warn("Failed to fetch version.json");
            return null;
          }

          const versionData = await response.json();
          return versionData;
        } catch (error) {
          console.warn("Error fetching version:", error);
          return null;

        const now = Date.now();
        const lastCheck = localStorage.getItem(LAST_CHECK_KEY);

          return;
        }

        localStorage.setItem(LAST_CHECK_KEY, now.toString());

        const latestVersion = await fetchCurrentVersion();

        if (!latestVersion) {
          return;
        }

        const storedVersion = localStorage.getItem(VERSION_STORAGE_KEY);

        // First time loading or version changed
        if (!storedVersion) {
          localStorage.setItem(VERSION_STORAGE_KEY, latestVersion.version);
          currentVersion = latestVersion.version;
        } else if (storedVersion !== latestVersion.version) {
          // Perform silent update in background
          performSilentUpdate(latestVersion);
        } else {
          currentVersion = storedVersion;
        }
      }

      async function performSilentUpdate(versionData) {
        pendingVersion = versionData.version;
        if (updateRunning) return;
        updateRunning = true;

        await waitForSafeMoment();

        // reload(true) is ignored by modern browsers and does NOT bypass the
        // service worker or the HTTP cache. Tear both down explicitly, then
        // reload — otherwise the user keeps getting the old bundle until they
        // hard refresh.
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            // Keep the push worker: unregistering it would silently switch
            // off browser notifications after every deploy.
            const isPushWorker = (r) =>
              [r.active, r.waiting, r.installing].some(
                (w) => w && w.scriptURL.endsWith("/firebase-messaging-sw.js"),
              );
            await Promise.all(
              regs.filter((r) => !isPushWorker(r)).map((r) => r.unregister()),
            );
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
          }
        } catch (error) {
          console.warn("Cache teardown failed:", error);
        }

        // The teardown took a moment: a refresh or a test may have started.
        await waitForSafeMoment();

        // No await from here on. The flag makes the app hold back new
        // refreshes until the page is gone; it is cleared in case the
        // navigation fails and the page stays.
        window.aaPageReloading = true;
        setTimeout(function () {
          window.aaPageReloading = false;
          updateRunning = false;
        }, RELOAD_FLAG_LIFETIME);
        localStorage.setItem(VERSION_STORAGE_KEY, pendingVersion);

        // Cache-busting query param forces a fresh document fetch even if the
        // host still hands out a cached index.html. It is stripped from the
        // address bar on the next load — see below.
        const url = new URL(window.location.href);
        url.searchParams.set("v", pendingVersion);
        window.location.replace(url.toString());
      }

      // Drop the ?v= buster once it has done its job. It only needs to be on
      // the wire for the reload request itself; leaving it in the address bar
      // means users see and share links carrying ?v=1.0.4%2B41 (searchParams
      // percent-encodes the +) forever after any update. replaceState rewrites
      // the bar without a navigation and preserves the path and every other
      // query param, so deep links and the router are unaffected. Runs at
      // parse time, before flutter_bootstrap.js starts the router.
      (function stripVersionParam() {
        try {
          const current = new URL(window.location.href);
          if (!current.searchParams.has("v")) return;
          current.searchParams.delete("v");
          window.history.replaceState(null, "", current.toString());
        } catch (error) {
          console.warn("Could not strip version param:", error);
        }
      })();

      // Initial version check on load
      window.addEventListener("load", function () {
        setTimeout(checkForUpdates, 2000); // Check 2 seconds after load
      });

      // Periodic version check
      versionCheckInterval = setInterval(
        checkForUpdates,
        VERSION_CHECK_INTERVAL,
      );

      // Check when tab becomes visible (user returns to tab)
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) {
          checkForUpdates();
        }
      });
    </script>

    <script>
      // The app is not needed on the homepage: it only loads on the other paths.
      if (!window.aaHome) {
        var aaBoot = document.createElement("script");
        aaBoot.src = "flutter_bootstrap.js?v=57";
        aaBoot.async = true;
        document.body.appendChild(aaBoot);
      }
    </script>
