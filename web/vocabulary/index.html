<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F3B">
<title>DSAT Vocabulary Challenge | Ammar Academy</title>
<style>
:root{
  --navy:#0E0F3B;--navy-2:#1C1E5A;--navy-tint:#E8E9F3;--orange:#F7931E;--orange-dk:#D97A0B;--orange-tint:#FEF1E0;
  --white:#FFFFFF;--bg:#F6F7F9;--line:#E2E4EC;--muted:#5B5F7A;--soft:#9095AE;
  --ok:#2F9E6B;--ok-tint:#E6F5EE;--bad:#D9534F;--bad-tint:#FBEAEA;
  --r:14px;--r-sm:12px;--shadow:0 1px 2px rgba(14,15,59,.06),0 8px 24px rgba(14,15,59,.06);
  --font:Inter,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--font);font-size:16px;line-height:1.5}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
header.top{background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top .wrap{display:flex;align-items:center;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:none;border:0;padding:0}
.brand img{height:42px;width:auto;display:block}
.brand .bt{display:flex;flex-direction:column;line-height:1.15;text-align:left;padding-left:14px;border-left:1px solid var(--line)}
.brand .bt b{font-size:15px;letter-spacing:.2px}
.brand .bt span{font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;border-radius:10px;font-weight:600;color:var(--muted);font-size:15px}
nav.tabs button:hover{background:var(--bg);color:var(--navy)}
nav.tabs button[aria-current="page"]{color:var(--navy);background:var(--navy-tint)}
.hud{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--bg);font-weight:700;font-size:14px;white-space:nowrap}
.pill.xp b{color:var(--orange-dk)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center}
.iconbtn:hover{border-color:var(--navy)}
.iconbtn svg{width:20px;height:20px}
.sitelink{font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;padding:8px 10px;border-radius:10px;white-space:nowrap}
.sitelink:hover{color:var(--navy);background:var(--bg)}
@media (max-width:820px){.sitelink{display:none}}

/* bottom nav (mobile) */
nav.bottom{display:none}
@media (max-width:820px){
  nav.tabs{display:none}
  .brand .bt{display:none}
  .brand img{height:36px}
  .hud{margin-left:auto}
  nav.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  nav.bottom button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--soft);min-height:58px}
  nav.bottom button svg{width:23px;height:23px}
  nav.bottom button[aria-current="page"]{color:var(--navy)}
  nav.bottom button[aria-current="page"] svg .ac{stroke:var(--orange)}
  main{padding-bottom:84px}
}
@media (max-width:420px){.pill.st{display:none}}

main{min-height:calc(100vh - 68px)}
#view:focus{outline:none}
.view{padding:28px 0 56px;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* generic */
h1,h2,h3{margin:0;line-height:1.2}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-dk)}
.muted{color:var(--muted)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:var(--r-sm);font-weight:700;font-size:15px;border:2px solid transparent;transition:transform .08s ease,background .15s,border-color .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:var(--white)}
.btn-primary:hover{background:var(--navy-2)}
.btn-cta{background:var(--orange);color:var(--navy)}
.btn-cta:hover{background:#FFA43A}
.btn-sec{background:var(--white);border-color:var(--navy);color:var(--navy)}
.btn-sec:hover{background:var(--navy-tint)}
.btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.btn-ghost:hover{color:var(--navy);border-color:var(--navy)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--white)}
.chip.alt[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.bar{height:8px;background:var(--navy-tint);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--orange);border-radius:99px;transition:width .5s ease}
.bar.thin{height:4px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--navy-tint);color:var(--navy)}
.lvl-0{background:#EEF0F5;color:#5B5F7A}.lvl-1{background:#FFF4E5;color:#A85B00}.lvl-2{background:#E7EAF8;color:#1C1E5A}.lvl-3{background:var(--ok-tint);color:#1E7A50}

/* home */
.hero{background:var(--navy);color:var(--white);border-radius:20px;padding:44px 44px 40px;position:relative;overflow:hidden}
.hero .acc{width:56px;height:5px;background:var(--orange);border-radius:4px;margin-bottom:18px}
.hero h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;letter-spacing:-.02em;max-width:620px}
.hero p.lead{font-size:clamp(17px,2vw,20px);color:#C9CBE0;margin:14px 0 26px}
.hero .row{gap:12px}
.hero .btn-sec{background:transparent;border-color:rgba(255,255,255,.4);color:var(--white)}
.hero .btn-sec:hover{background:rgba(255,255,255,.08)}
.hero .cont{font-size:13px;color:#B9BCD6;margin-top:12px}
.hero .deco{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:300px;height:250px}
.hero .deco div{position:absolute;width:200px;background:#fff;border-radius:14px;padding:10px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.hero .deco svg{display:block;width:100%;height:auto}
.hero .deco div:nth-child(1){left:0;top:10px;transform:rotate(-8deg)}
.hero .deco div:nth-child(2){left:90px;top:0;transform:rotate(5deg)}
.hero .deco div:nth-child(3){left:40px;top:110px;transform:rotate(-2deg)}
@media (max-width:1100px){.hero .deco{display:none}}
.path{display:flex;flex-wrap:wrap;gap:6px;margin-top:26px;font-size:12px;font-weight:800;letter-spacing:.08em}
.path span{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.08);color:#DADCF0}
.path span.on{background:var(--orange);color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.stat{padding:18px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.overall{padding:18px 20px;margin-bottom:22px}
.overall .row{justify-content:space-between;margin-bottom:10px;font-weight:700}
.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.module{padding:24px;text-align:left;border:1px solid var(--line);background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .15s,border-color .15s}
.module:hover{transform:translateY(-2px);border-color:var(--navy)}
.module .ico{width:52px;height:52px;border-radius:14px;background:var(--navy-tint);display:grid;place-items:center}
.module .ico svg{width:30px;height:30px}
.module h3{font-size:20px}
.module p{margin:0;color:var(--muted);font-size:15px}
.module .go{margin-top:auto;font-weight:700;color:var(--orange-dk);font-size:14px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 12px}
.section-h h2{font-size:20px}
.wordchips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.wchip:hover{border-color:var(--orange)}
.wchip i{width:8px;height:8px;border-radius:50%;background:var(--orange)}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:15px}
@media (max-width:900px){.modules{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero .deco{display:none}}
@media (max-width:560px){.hero{padding:30px 22px 28px;border-radius:16px}.wrap{padding:0 14px}.view{padding-top:16px}.stat{padding:14px}.stat b{font-size:24px}}

/* learn */
.toolbar{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.toolrow{display:flex;gap:10px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px 0 42px;background:var(--white)}
.search input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-tint)}
.search svg{position:absolute;left:14px;top:13px;width:20px;height:20px;color:var(--soft)}
.results{position:absolute;top:50px;left:0;right:0;background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;max-height:300px;overflow:auto}
.results button{display:flex;width:100%;text-align:left;gap:10px;align-items:center;padding:10px 14px;background:none;border:0;border-bottom:1px solid var(--bg)}
.results button:hover,.results button:focus{background:var(--orange-tint)}
.results small{color:var(--muted)}
.lcard{display:grid;grid-template-columns:minmax(0,42fr) minmax(0,58fr);overflow:hidden}
.lvis{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-start;padding:56px 24px 24px;gap:14px}
.lvis>svg{background:#fff;border-radius:14px;padding:10px;border:1px solid var(--line)}
.lvis svg{width:100%;height:auto;display:block}
.lvis .cap{font-size:13px;color:var(--muted);text-align:center}
.lbody{padding:28px 30px 26px;display:flex;flex-direction:column;gap:18px}
.lhead{display:flex;justify-content:space-between;align-items:center}
.wnum{font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
.wordline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bigword{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:.01em;line-height:1.05;word-break:break-word}
.speak{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:7px 14px 7px 10px;font-weight:700;font-size:14px;min-height:40px}
.speak:hover{border-color:var(--orange)}
.speak svg{width:20px;height:20px;color:var(--orange)}
.speak.playing{background:var(--orange-tint);border-color:var(--orange)}
.syn{font-size:20px;font-weight:600;color:var(--navy-2)}
.syn .dot{color:var(--orange);margin:0 8px}
.mvis{display:none}
.ex{background:var(--bg);border-radius:12px;padding:16px 18px}
.ex .lab{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex p{margin:0;font-size:18px;line-height:1.7}
mark.hl{background:var(--orange-tint);color:var(--navy);font-weight:700;padding:1px 4px;border-radius:5px;box-shadow:inset 0 -2px 0 var(--orange)}
mark.hl.speaking{animation:pulse 1s ease infinite}
@keyframes pulse{50%{background:#FCD9AA}}
.ar-toggle{align-self:flex-start;background:none;border:0;padding:4px 0;color:var(--muted);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ar{direction:rtl;font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;font-size:20px;color:var(--navy-2);background:var(--white);border:1px dashed var(--line);border-radius:10px;padding:8px 14px;align-self:flex-start}
.spell{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.spell h3{font-size:16px}
.spell .mean{font-size:15px;color:var(--muted)}
.spell .mean b{color:var(--navy)}
.inrow{display:flex;gap:10px}
.inrow input{flex:1;min-width:0;height:50px;border:2px solid var(--line);border-radius:12px;padding:0 16px;font-size:18px;font-weight:600;background:var(--white)}
.inrow input:focus{outline:none;border-color:var(--navy)}
.inrow input.good{border-color:var(--ok);background:var(--ok-tint)}
.inrow input.badin{border-color:var(--bad)}
.fb{font-weight:700;font-size:15px;min-height:22px}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.hint{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.25em;font-weight:700;color:var(--navy-2)}
.lfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:4px}
.lfoot .mid{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;order:-1}
.lfoot .mid:only-child{grid-template-columns:1fr}
.lfoot>.btn:last-child{justify-self:stretch}
.mastery-line{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:600}
.mastery-line .bar{flex:1;max-width:160px}
.hide-word{letter-spacing:.06em;color:var(--soft)}
.reveal-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.setinfo{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-weight:600;margin:4px 2px 12px}
.setinfo .bar{flex:0 0 180px}
@media (max-width:820px){
  .lcard{grid-template-columns:minmax(0,1fr)}
  .lbody{min-width:0}
  .bigword{font-size:clamp(26px,8.4vw,40px)}
  .rlab{display:none}
  .ex .lab{flex-wrap:wrap}
  .lvis{display:none}
  .mvis{display:block;background:var(--bg);border-radius:14px;padding:14px}
  .mvis svg{width:100%;height:auto;display:block;max-height:240px}
  .lbody{padding:20px 18px}
  .ex p{font-size:17px}
  .setinfo .bar{flex-basis:110px}
}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mcol h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.mitem{min-height:58px;padding:12px 14px;border:2px solid var(--line);background:var(--white);border-radius:12px;text-align:left;font-weight:700;transition:border-color .15s,background .15s,opacity .3s}
.mitem.word{font-size:16px;letter-spacing:.03em;text-transform:uppercase}
.mitem.def{font-size:15px;font-weight:600}
.mitem:hover{border-color:var(--soft)}
.mitem.sel-w{border-color:var(--navy);background:var(--navy-tint)}
.mitem.sel-d{border-color:var(--orange);background:var(--orange-tint)}
.mitem.done{border-color:var(--ok);background:var(--ok-tint);opacity:.75;pointer-events:none;animation:pop .3s ease}
.mitem.done::after{content:"  ✓";color:var(--ok)}
.shake{animation:shake .35s ease}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{50%{transform:scale(1.03)}}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.mstats{display:flex;gap:8px}
.result{padding:30px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.result h2{font-size:28px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;width:100%;max-width:640px}
.rgrid div{background:var(--bg);border-radius:12px;padding:14px}
.rgrid b{display:block;font-size:24px}
.rgrid span{font-size:13px;color:var(--muted);font-weight:600}
@media (max-width:560px){.mgrid{gap:8px}.mitem{padding:10px;min-height:54px}.mitem.word{font-size:14px}.mitem.def{font-size:14px}}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px;gap:10px}
.qtop .qn{font-size:15px}
.qtop .qn span{color:var(--muted);font-weight:600}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:14px;align-items:start}
.passage{padding:26px;border:1px solid #CFD2E2}
.passage p{margin:0;font-size:18px;line-height:1.75}
.passage .blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--orange);margin:0 4px;transform:translateY(-3px);text-align:center;font-weight:800;color:var(--orange-dk)}
.passage .prompt{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-weight:700;font-size:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;min-height:58px;padding:12px 16px;border:2px solid var(--line);background:var(--white);border-radius:12px;text-align:left;font-size:18px;font-weight:600;width:100%;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--orange)}
.opt .lt{flex:0 0 34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--navy-tint);font-weight:800;font-size:15px}
.opt[aria-checked="true"]{border-color:var(--orange);background:var(--orange-tint)}
.opt[aria-checked="true"] .lt{background:var(--orange);color:var(--navy)}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt.wrong .lt{background:var(--bad);color:#fff}
.opt.locked{pointer-events:none}
.qact{display:flex;gap:10px;margin-top:14px}
.qact .btn{flex:1}
.feedback{margin-top:16px;padding:18px;border-radius:14px;border:2px solid var(--line);background:var(--white);animation:pop .3s ease}
.feedback.good{border-color:var(--ok)}
.feedback.bad{border-color:var(--bad)}
.feedback .fh{font-size:20px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.feedback.good .fh{color:var(--ok)}.feedback.bad .fh{color:var(--bad)}
.target{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:var(--bg);border-radius:12px;padding:12px}
.target svg{width:120px;height:auto;display:block}
.target .tl{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--muted);text-transform:uppercase}
.target .tw{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.target .tm{font-weight:600;color:var(--navy-2)}
.target .te{font-size:14px;color:var(--muted);margin-top:4px}
.setup{padding:26px;display:flex;flex-direction:column;gap:20px}
.setup h3{font-size:15px;margin-bottom:8px}
.seg{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:10px 18px;border-radius:9px;font-weight:700;color:var(--muted);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--navy);box-shadow:var(--shadow)}
.modehelp{font-size:14px;color:var(--muted);margin-top:6px}
.rlist{display:flex;flex-direction:column;gap:12px;width:100%;text-align:left}
.ritem{padding:16px;border-radius:12px;border:1px solid var(--line);background:var(--white)}
.ritem .rq{font-size:15px;line-height:1.65;margin:6px 0 10px}
.ritem .ra{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;font-weight:700}
.ritem .ra .y{color:var(--bad)}.ritem .ra .c{color:var(--ok)}
.ritem .ra .y.ok{color:var(--ok)}
.vlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
@media (max-width:860px){.qwrap{grid-template-columns:1fr}.passage{padding:20px}.passage p{font-size:17px}.opt{font-size:17px}.target{grid-template-columns:90px 1fr}.target svg{width:90px}}

/* progress */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.perf{padding:20px}
.perf .row{justify-content:space-between;font-weight:700;margin-bottom:8px}
.heat{display:grid;grid-template-columns:repeat(20,1fr);gap:4px}
.heat button{aspect-ratio:1;border:0;border-radius:4px;padding:0}
.heat .h0{background:#E6E8EF}.heat .h1{background:#FAD3A0}.heat .h2{background:#F7931E}.heat .h3{background:var(--navy)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td,.tbl th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl button{background:none;border:0;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:3px}
@media (max-width:820px){.pgrid{grid-template-columns:1fr}.heat{grid-template-columns:repeat(10,1fr)}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(14,15,59,.45);display:grid;place-items:center;z-index:60;padding:16px;animation:fadein .2s}
.modal{background:var(--white);border-radius:18px;max-width:440px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(14,15,59,.3)}
.modal h2{font-size:22px;margin-bottom:6px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:10px}
.switch{width:52px;height:30px;border-radius:99px;background:#D3D6E2;border:0;position:relative;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--navy)}
.switch[aria-checked="true"]::after{left:25px}
.danger{color:var(--bad);border-color:var(--bad)!important}
.celebrate{text-align:center}
.celebrate img{height:70px;margin:4px auto 14px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:70;font-size:14px;box-shadow:var(--shadow);animation:fadein .2s}
@media (max-width:820px){.toast{bottom:90px}}
.xpfloat{position:fixed;font-weight:800;color:var(--orange-dk);pointer-events:none;z-index:80;animation:xpf 0.9s ease forwards}
@keyframes xpf{to{transform:translateY(-36px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  const vIds=new Set(vocabulary.map(v=>v.id)), qIds=new Set(contextQuestions.map(q=>q.id));

function mastery(id){

function highlight(sentence,word){
  const e=esc(sentence); const w=word.toLowerCase();

  const parts=w.split(/[\s-]+/); const main=parts.filter(p=>p.length>3); let out=e, from=0;
  main.forEach(p=>{ const stem=p.slice(0,Math.max(4,p.length-2)); const re=new RegExp("\\b("+stem+"\\w*)","i"); const m=out.slice(from).match(re);
    if(m){ const at=from+m.index; out=out.slice(0,at)+`<mark class="hl">${m[1]}</mark>`+out.slice(at+m[1].length); from=at+m[1].length+25; } });

}

let route="home";
function go(r,opts={}){
  stopSpeech(); route=r;
  $$("[data-go]").forEach(b=>{ if(b.closest("nav")) b.setAttribute("aria-current",b.dataset.go===r?"page":"false"); });
  const v=$("#view"); v.className="view"; void v.offsetWidth;
  ({home:renderHome,learn:renderLearn,match:renderMatch,quiz:renderQuiz,progress:renderProgress}[r]||renderHome)(opts);
  try{ if(!opts.keepScroll) window.scrollTo(0,0); }catch(e){}
  try{ if(opts.focus!==false) v.focus({preventScroll:true}); }catch(e){}
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const a=e.target.closest("[data-act]"); if(a&&a.dataset.act==="settings") openSettings();
});

/* ================= LEARN ================= */
const groups=(n,size)=>Array.from({length:Math.ceil(n/size)},(_,i)=>[i*size+1,Math.min(n,(i+1)*size)]);
const SETS=groups(NV,10).map(([a,b],i)=>[`${a}-${b}`,i===0?`Words ${a}–${b}`:`${a}–${b}`]).concat([["all",`All ${NV} Words`],["diff","My Difficult Words"]]);
const inRange=(set,id)=>{const m=/^(\d+)-(\d+)$/.exec(set);return !!m&&id>=+m[1]&&id<=+m[2];};
function setIds(set){
  if(set==="all") return vocabulary.map(v=>v.id);
  if(set==="diff") return difficultIds();
  if(set==="search") return S.learn.searchIds||[];
  if(!/^\d+-\d+$/.test(set)) return vocabulary.map(v=>v.id);
  return vocabulary.filter(v=>inRange(set,v.id)).map(v=>v.id);
}
function openWord(id){
  const set=SETS.find(([k])=>inRange(k,id))[0];
  S.learn.set=set; S.learn.idx=setIds(set).indexOf(id); S.learn.mode="study"; save(); go("learn");
}
let spell={attempts:0,done:false,shown:false};
function renderLearn(){
  const L=S.learn; const ids=setIds(L.set); if(L.idx>=ids.length) L.idx=Math.max(0,ids.length-1);
  const modeChips=[["study","Study"],["guess","Guess From the Picture"],["review","Review by Pictures"]];
  $("#view").innerHTML=`
  <div class="toolbar">
    <div class="toolrow">
      <div class="search"><label class="sr" for="srch">Search a word</label>${I.search}<input id="srch" type="search" placeholder="Search a word…" autocomplete="off"><div class="results" id="sres" hidden></div></div>
      <button class="btn btn-sec" id="rnd" aria-label="Random word">${I.dice}<span class="rlab">Random Word</span></button>
    </div>
    <div class="chips" role="group" aria-label="Activity">${modeChips.map(([k,t])=>`<button class="chip alt" aria-pressed="${L.mode===k}" data-mode="${k}">${t}</button>`).join("")}</div>
    <div class="chips" role="group" aria-label="Study set">${SETS.map(([k,t])=>`<button class="chip" aria-pressed="${L.set===k}" data-set="${k}">${t}${k==="diff"?` (${difficultIds().length})`:""}</button>`).join("")}${L.set==="search"?`<button class="chip" aria-pressed="true">Search results</button>`:""}</div>
  </div>
  <div id="lmain"></div>`;
  $$("[data-set]").forEach(b=>b.onclick=()=>{ S.learn.set=b.dataset.set; S.learn.idx=0; save(); renderLearn(); });
  $$("[data-mode]").forEach(b=>b.onclick=()=>{ S.learn.mode=b.dataset.mode; save(); renderLearn(); });
  $("#rnd").onclick=()=>{ const pool=vocabulary.map(v=>v.id); const id=pool[Math.floor(Math.random()*pool.length)]; openWord(id); };
  const si=$("#srch"),sr=$("#sres");
  si.oninput=()=>{ const q=si.value.trim().toLowerCase(); if(!q){sr.hidden=true;return;}
    const hits=vocabulary.filter(v=>v.word.includes(q)||v.synonyms.some(s=>s.toLowerCase().includes(q))).slice(0,8);
    sr.innerHTML=hits.length?hits.map(v=>`<button data-hit="${v.id}"><b>${esc(v.display)}</b><small>${esc(v.synonyms.join(" • "))}</small></button>`).join(""):`<div class="empty" style="padding:12px">No word found</div>`;
    sr.hidden=false; $$("[data-hit]",sr).forEach(b=>b.onclick=()=>openWord(+b.dataset.hit)); };
  si.onkeydown=e=>{ if(e.key==="Enter"){ const f=$("[data-hit]",sr); if(f) f.click(); } if(e.key==="Escape"){ sr.hidden=true; } };
  if(!ids.length){ $("#lmain").innerHTML=`<div class="card empty" style="padding:40px">${L.set==="diff"?"No difficult words yet — nice work. Words you miss will appear here.":"No words in this set."}</div>`; return; }
  const id=ids[L.idx];
  if(L.mode==="study") renderStudy(id,ids); else if(L.mode==="guess") renderGuess(id,ids); else renderReview(id,ids);
  S.last={view:"learn",id}; save();
}

function hintFor(word){ let k=0; return word.toUpperCase().split("").map(ch=>{ if(/[A-Z]/.test(ch)){ const s=(k%3===1)?"_":ch; k++; return s; } return ch===" "?"\u00a0\u00a0":ch; }).join(" "); }
function checkSpell(id,ev){
  if(spell.done) return; const v=V(id), w=W(id), inp=$("#spIn"), fb=$("#spFb"); const val=inp.value;
  if(!val.trim()){ inp.focus(); return; }
  spell.attempts++;
  if(norm(val)===norm(v.word)){
    spell.done=true; inp.classList.remove("badin"); inp.classList.add("good"); fb.className="fb ok";
    const first=!w.learned||w.spellingCorrect===0; w.learned=true;
    if(!spell.shown){ w.spellingCorrect++; addXP(5,ev); streakHit(true); fb.textContent="Correct! +5 XP — press Enter or Next Word to continue."; }
    else fb.textContent="Correct — now you've written it yourself. Press Next Word.";
    sfx("ok"); live("Correct"); save(); $("#spHint").innerHTML=""; $("#spShow").hidden=true;
    $(".tag",$("#lmain")).outerHTML=`<span class="tag lvl-${level(mastery(id))}">${LEVELS[level(mastery(id))]} · ${mastery(id)}%</span>`;
    checkCelebration();
  } else {
    w.spellingWrong++; streakHit(false); sfx("bad"); inp.classList.add("badin"); inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
    fb.className="fb no"; fb.textContent=spell.attempts>=2?"Try again — here's a hint:":"Try again."; live(fb.textContent);
    if(spell.attempts>=2) $("#spHint").innerHTML=`<div class="hint" aria-label="Hint">${hintFor(v.word)}</div>`;
    $("#spShow").hidden=false; inp.select(); save();
  }
}

function matchPool(set){
  let ids=vocabulary.map(v=>v.id);
  if(/^\d+-\d+$/.test(set)) ids=ids.filter(i=>inRange(set,i));
  else if(set==="studied") ids=ids.filter(studied);
  else if(set==="mistakes") ids=ids.filter(i=>{const w=W(i);return w.synonymWrong>0||isDifficult(i);});
  return ids;
}
function pickRound(set){
  const pool=matchPool(set); if(pool.length<2) return null;
  const recent=new Set(S.match.recent||[]);
  const weight=i=>{ const w=W(i); let x=1+w.synonymWrong*2+(isDifficult(i)?2:0)-Math.min(w.synonymCorrect,3)*0.25; if(set==="mistakes") x+=w.synonymWrong*3; if(recent.has(i)) x*=pool.length>20?0.05:0.4; return Math.max(.05,x); };
  const chosen=[]; const avail=[...pool]; const n=Math.min(5,pool.length);
  const synKeys=i=>V(i).synonyms.map(x=>x.toLowerCase().trim());
  const clash=i=>{ const a=synKeys(i); return chosen.some(j=>synKeys(j).some(x=>a.includes(x))); };
  while(chosen.length<n&&avail.length){ const tot=avail.reduce((s,i)=>s+weight(i),0); let r=Math.random()*tot; let k=0; for(;k<avail.length;k++){ r-=weight(avail[k]); if(r<=0) break; } const pick=avail.splice(Math.min(k,avail.length-1),1)[0]; if(!clash(pick)) chosen.push(pick); }
  S.match.recent=[...chosen,...(S.match.recent||[])].slice(0,20); save();
  return chosen;
}
function newRound(){
  const ids=pickRound(S.match.set);

  </div>
  <div class="section-h"><h2>Performance</h2></div>
  <div class="pgrid">${perf("Spelling Accuracy",sc,sw)}${perf("Matching Accuracy",mc,mw)}${perf("Context Accuracy",cc,cw)}</div>
  <div class="section-h"><h2>Recent Scores</h2></div>
  <div class="card" style="padding:6px 16px">${S.history.length?recentTable(8):`<div class="empty">Finish a Context Challenge set to see your scores here.</div>`}</div>
  <div class="section-h"><h2>Weakest Vocabulary</h2></div>
  <div class="card" style="padding:6px 16px">${weakest.length?`<table class="tbl"><thead><tr><th>Word</th><th>Mastery</th><th>Level</th></tr></thead><tbody>${weakest.map(id=>`<tr><td><button data-open="${id}">${esc(V(id).display)}</button></td><td>${mastery(id)}%</td><td><span class="tag lvl-${level(mastery(id))}">${LEVELS[level(mastery(id))]}</span></td></tr>`).join("")}</tbody></table>`:`<div class="empty">Start learning to see which words need more work.</div>`}</div>
  <div class="section-h"><h2>My Difficult Words</h2></div>
  ${difficultIds().length?`<div class="wordchips">${difficultIds().map(id=>`<button class="wchip" data-open="${id}"><i></i>${esc(V(id).display)}</button>`).join("")}</div>`:`<div class="card empty">No difficult words right now.</div>`}
  <div style="margin-top:34px"><button class="btn btn-ghost danger" id="pReset">Reset Progress</button></div>`;
  $$("[data-open]").forEach(b=>b.onclick=()=>openWord(+b.dataset.open));
  $("#pReset").onclick=confirmReset;
}

/* ================= Modals ================= */
function modal(html,onMount){ const root=$("#modalRoot"); const prev=document.activeElement;
  root.innerHTML=`<div class="scrim" role="presentation"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const close=()=>{ root.innerHTML=""; prev&&prev.focus&&prev.focus(); };
  $(".scrim",root).addEventListener("click",e=>{ if(e.target.classList.contains("scrim")) close(); });
  root.onkeydown=e=>{ if(e.key==="Escape") close(); };
  onMount&&onMount(close); const f=$("button,input",root); f&&f.focus(); return close; }
function openSettings(){
  modal(`<h2>Settings</h2><p class="muted" style="margin:0 0 6px;font-size:14px">Your progress saves automatically in this browser.</p>
   <div class="setrow"><div><b>Sound effects</b><div class="muted" style="font-size:13px">Subtle tones for correct / incorrect</div></div><button class="switch" role="switch" id="sSnd" aria-checked="${S.settings.sound}" aria-label="Sound effects"></button></div>
   <div class="setrow"><div><b>Speech speed</b><div class="muted" style="font-size:13px">For word and example audio</div></div><div class="seg" role="group" aria-label="Speech speed"><button data-rate="0.72" aria-pressed="${S.settings.rate<0.8}">Slow</button><button data-rate="0.85" aria-pressed="${S.settings.rate>=0.8&&S.settings.rate<0.95}">Clear</button><button data-rate="1" aria-pressed="${S.settings.rate>=0.95}">Normal</button></div></div>
   <div class="setrow" style="border:0"><div><b>Reset progress</b><div class="muted" style="font-size:13px">Erase everything and start over</div></div><button class="btn btn-ghost danger" id="sReset" style="min-height:40px">Reset</button></div>
   <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn btn-primary" id="sDone">Done</button></div>`,close=>{
    $("#sSnd").onclick=e=>{ S.settings.sound=!S.settings.sound; e.currentTarget.setAttribute("aria-checked",S.settings.sound); save(); if(S.settings.sound) sfx("ok"); };
    $$("[data-rate]").forEach(b=>b.onclick=()=>{ S.settings.rate=+b.dataset.rate; save(); $$("[data-rate]").forEach(x=>x.setAttribute("aria-pressed",x===b)); speak("meticulous"); });
    $("#sReset").onclick=()=>{ close(); confirmReset(); }; $("#sDone").onclick=close; });
}
function confirmReset(){
  modal(`<h2>Reset progress?</h2><p style="margin:6px 0 18px">Are you sure? Your vocabulary progress and quiz history will be erased.</p>
    <div class="row" style="justify-content:flex-end"><button class="btn btn-sec" id="cNo">Cancel</button><button class="btn btn-primary" id="cYes" style="background:var(--bad)">Yes, erase everything</button></div>`,close=>{
    $("#cNo").onclick=close; $("#cYes").onclick=()=>{ const snd=S.settings; S=fresh(); S.settings=snd; M=null; saveNow(); close(); updateHud(); toast("Progress reset."); go("home"); }; });
}
function checkCelebration(){
  const fk="wordsComplete_"+NV; if(S.flags[fk]) return;
  if(vocabulary.every(v=>W(v.id).learned)){ S.flags[fk]=true; save(); sfx("level");
    modal(`<div class="celebrate"><img src="${LOGO}" alt="Ammar Academy"><div class="eyebrow">Milestone</div><h2 style="font-size:26px;margin:6px 0">${NV} Words Completed</h2><p class="muted">Excellent work. Now test your vocabulary in context.</p><div class="row" style="justify-content:center;margin-top:16px"><button class="btn btn-cta" id="cGo">Start DSAT Challenge</button><button class="btn btn-ghost" id="cLater">Later</button></div></div>`,close=>{
      $("#cGo").onclick=()=>{ close(); S.quiz.set="all"; S.quiz.session=null; save(); go("quiz"); }; $("#cLater").onclick=close; });
  }
}

/* ================= Boot ================= */
try{ if(/ammar-academy\.com$/i.test(location.hostname)) $("#siteLink").hidden=false; }catch(e){}
updateHud();
if(validationErrors.length) console.warn("[DSAT Vocab] App started with data issues — see errors above.");
go("home",{focus:false});
if(!store) setTimeout(()=>toast("Preview mode: progress won't be saved here. Open the file in Safari or Chrome to keep it."),600);
window.__DSAT__={S:()=>S,mastery,validate,norm};
})();
}catch(e){ window.__aaFail(e); }
</script>
</body>
</html>
