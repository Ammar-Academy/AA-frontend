name: Publish blog

# Brings the blog written in the dashboard (Django admin → Blog posts) to
# ammar-academy.com/blog/: scripts/publish_blog.py reads the published
# articles from /api/blog/export/ and updates web/blog/, sitemap.xml and
# llms.txt. If anything changed it is committed to main and pulled on the
# droplet (the same locked-down deploy key as deploy.yml). Runs every 15
# minutes; "Run workflow" in the Actions tab publishes right away.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Update the blog pages
        run: python3 scripts/publish_blog.py

      - name: Commit the changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain web)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web
          git commit -m "Blog: publish from the dashboard"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up the SSH key
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Only a git pull: nginx serves the new files right away, so the
      # backend is not restarted for a blog change.
      - name: Pull the website on the server
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" frontend

      - name: Check the live blog
        if: steps.commit.outputs.changed == 'true'
        run: |
          for page in blog/index.html sitemap.xml; do
            url="https://ammar-academy.com/${page%index.html}?ts=$(date +%s)"
            for try in 1 2 3 4 5 6; do
              curl -fsS "$url" -o live.tmp && cmp -s live.tmp "web/$page" && break
              [ "$try" = 6 ] && { echo "::error::$page is not live yet"; exit 1; }
              sleep 10
            done
          done
